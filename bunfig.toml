[test]
coverage = true

# Measured from this repo's own coverage when the gauntlet was armed, minus a
# 2-point margin for run-to-run noise. Raise it when the suite improves; never
# lower it. Lowering these lines is the only way coverage can regress, which is
# the point.
#
# The number is unchanged from the scalar `coverageThreshold = 0.9` this
# replaces. Only the form changed: Bun applies the scalar to every file
# individually, so a single below-average module (src/ingest.ts, 68% lines)
# failed the whole run even though the project total was 92%. The failure was
# also silent - `bun test` printed "31 pass, 0 fail" and still exited 1, which
# is what made the stryker job report "failed tests in the initial test run"
# when no test had actually failed.
[test.coverageThreshold]
line = 0.9
function = 0.9
statement = 0.9
